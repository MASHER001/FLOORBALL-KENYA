<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — FloorballKenya</title>
  <link rel="icon" href="/FloorballKenya/frontend/assets/img/icons/image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/animations.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/variables.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/style.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/components.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/pages.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/animations.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/responsive.css" />
</head>
<body>
  <header id="navbar"></header>

  <main>
    <div class="auth-wrapper">
      <div class="auth-card animate-scale-in">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your FloorballKenya account</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" name="email" class="form-control" required
                   autocomplete="email" placeholder="you@example.com" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required
                   autocomplete="current-password" placeholder="Your password" />
          </div>

          <div class="flex-between" style="margin-bottom: var(--sp-5);">
            <label class="form-check">
              <input type="checkbox" name="remember" />
              Remember me
            </label>
            <a href="/FloorballKenya/frontend/pages/auth/forgot-password.html" style="font-size: var(--fs-sm);">
              Forgot password?
            </a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-full">
            Sign in
          </button>
        </form>

        <div class="divider-text">or</div>

        <p class="auth-footer">
          Don't have an account?
          <a href="/FloorballKenya/frontend/pages/auth/register.html">Create one</a>
        </p>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script type="module">
    import { renderNavbar } from "../../js/components/navbar.js";
    import { renderFooter } from "../../js/components/footer.js";
    import { initLogin }    from "../../js/pages/login.js";

    renderNavbar();
    renderFooter();
    initLogin();
  </script>
</body>
</html>
