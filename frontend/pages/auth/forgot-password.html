<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — FloorballKenya</title>
  <link rel="icon" href="/\/FloorballKenya/frontend/assets/img/icons/image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/animations.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/variables.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/style.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/components.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/pages.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/animations.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/responsive.css" />
</head>
<body>
  <header id="navbar"></header>

  <main>
    <div class="auth-wrapper">
      <div class="auth-card animate-scale-in">
        <h1>Reset your password</h1>
        <p class="subtitle">Enter your email and we'll send you a reset link.</p>

        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" name="email" class="form-control" required
                   autocomplete="email" placeholder="you@example.com" />
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-full">
            Send reset link
          </button>
        </form>

        <p class="auth-footer">
          Remember your password?
          <a href="../../pages/auth/login.html">Back to sign in</a>
        </p>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script type="module">
    import { renderNavbar } from "../../js/components/navbar.js";
    import { renderFooter } from "../../js/components/footer.js";
    import { initForgotPassword } from "../../js/pages/forgot-password.js";

    renderNavbar();
    renderFooter();
    initForgotPassword();
  </script>
</body>
</html>
