<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Players — FloorballKenya</title>
  <link rel="icon" href="/FloorballKenya/frontend/assets/img/logo/image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/animations.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/components.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/pages.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/responsive.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/style.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/variables.css" />
</head>
<body>
  <header id="navbar"></header>
  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumbs"><a href="/FloorballKenya/frontend/index.html">Home</a> <span>/</span> <span>Players</span></div>
        <h1>Players</h1>
        <p class="text-muted">Every floorball player across Kenya.</p>
      </div>
    </div>
    <section class="section">
      <div class="container">
        <div class="flex gap-4 flex-wrap mb-8">
          <input type="search" id="players-search" class="form-control" placeholder="Search players by name…" style="max-width: 320px;" />
          <select id="players-position" class="form-select" style="max-width: 220px;">
            <option value="">All positions</option>
            <option value="goalkeeper">Goalkeeper</option>
            <option value="defender">Defender</option>
            <option value="forward">Forward</option>
            <option value="center">Center</option>
          </select>
        </div>
        <div id="players-list"></div>
        <div id="players-pagination"></div>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
  <script type="module">
    import { renderNavbar } from "../../js/components/navbar.js";
    import { renderFooter } from "../../js/components/footer.js";
    import { initPlayers }  from "../../js/pages/players.js";
    renderNavbar(); renderFooter(); initPlayers();
  </script>
</body>
</html>
