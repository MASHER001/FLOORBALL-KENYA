<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — FloorballKenya</title>
  <meta name="description" content="Get in touch with FloorballKenya." />
  <link rel="icon" href="/FloorballKenya/frontend/assets/img/icons/image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/components.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/variables.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/style.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/components.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/pages.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/animations.css" />
  <link rel="stylesheet" href="/FloorballKenya/frontend/css/responsive.css" />
</head>
<body>
  <header id="navbar"></header>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumbs">
          <a href="/FloorballKenya/frontend/index.html">Home</a> <span>/</span> <span>Contact</span>
        </div>
        <h1>Get in touch</h1>
        <p class="text-muted">We'd love to hear from you.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="grid grid-2" style="gap: var(--sp-10); align-items:start;">
          <div>
            <h2 style="margin-bottom: var(--sp-4);">Send us a message</h2>
            <p class="text-muted" style="margin-bottom: var(--sp-6);">
              Fill the form and we'll get back to you as soon as we can.
            </p>

            <form id="contact-form" novalidate>
              <div class="form-group">
                <label class="form-label" for="name">Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" class="form-control" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" class="form-control" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="subject">Subject <span class="required">*</span></label>
                <input type="text" id="subject" name="subject" class="form-control" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="message">Message <span class="required">*</span></label>
                <textarea id="message" name="message" class="form-textarea" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-lg btn-full">Send message</button>
            </form>
          </div>

          <div>
            <h2 style="margin-bottom: var(--sp-4);">Other ways to reach us</h2>
            <div class="card" style="margin-bottom: var(--sp-4);">
              <div class="card-body">
                <div class="card-title">Email</div>
                <p class="card-text">hello@floorballkenya.com</p>
              </div>
            </div>
            <div class="card" style="margin-bottom: var(--sp-4);">
              <div class="card-body">
                <div class="card-title">WhatsApp</div>
                <p class="card-text">+254 751 130 425</p>
              </div>
            </div>
            <div class="card" style="margin-bottom: var(--sp-4);">
              <div class="card-body">
                <div class="card-title">Location</div>
                <p class="card-text">Nairobi, Kenya</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script type="module">
    import { renderNavbar } from "../../js/components/navbar.js";
    import { renderFooter } from "../../js/components/footer.js";
    import { initContact }  from "../../js/pages/contact.js";

    renderNavbar();
    renderFooter();
    initContact();
  </script>
</body>
</html>
